<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VisionaryMinds Solutions</title>
  <meta name="description" content="VisionaryMinds Solutions builds clean AI systems, automations, and workflows for businesses that want less friction and more leverage.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0c0f13;
      --bg-2: #11161c;
      --panel: rgba(255, 255, 255, 0.045);
      --panel-2: rgba(255, 255, 255, 0.03);
      --border: rgba(255, 255, 255, 0.10);
      --text: #f5f7fa;
      --muted: #a4acb8;
      --faint: #6f7884;
      --accent: #7ed9ca;
      --accent-2: #dffdf7;
      --radius: 24px;
      --shadow: 0 24px 64px rgba(0,0,0,0.32);
      --max: 1100px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      font-family: Inter, system-ui, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 0% 0%, rgba(126,217,202,0.10), transparent 28%),
        radial-gradient(circle at 100% 0%, rgba(255,255,255,0.04), transparent 18%),
        linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
      min-height: 100vh;
    }

    a { color: inherit; text-decoration: none; }

    .wrap {
      width: min(calc(100% - 32px), var(--max));
      margin: 0 auto;
    }

    .site-header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(12,15,19,0.78);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }

    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 18px 0;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      font-weight: 700;
      letter-spacing: -0.03em;
    }

    .brand img {
      width: 40px;
      height: 40px;
      object-fit: contain;
      display: block;
    }

    .brand-name {
      font-size: 1rem;
    }

    .nav {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .nav-link {
      color: var(--muted);
      font-size: 0.95rem;
    }

    .nav-link:hover { color: var(--text); }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 0 18px;
      border-radius: 999px;
      border: 1px solid var(--border);
      font-weight: 600;
      transition: transform 180ms ease, background 180ms ease, border-color 180ms ease;
    }

    .btn:hover { transform: translateY(-1px); }

    .btn-primary {
      background: var(--text);
      color: #0c0f13;
      border-color: transparent;
      box-shadow: 0 10px 30px rgba(255,255,255,0.10);
    }

    .btn-secondary {
      background: rgba(255,255,255,0.03);
      color: var(--text);
    }

    .hero {
      padding: 72px 0 24px;
    }

    .hero-shell,
    .panel,
    .cta-shell {
      background: linear-gradient(180deg, var(--panel), var(--panel-2));
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .hero-shell {
      padding: 40px;
    }

    .eyebrow,
    .mini-pill {
      display: inline-flex;
      align-items: center;
      padding: 8px 12px;
      border-radius: 999px;
      font-size: 0.82rem;
      letter-spacing: 0.02em;
    }

    .eyebrow {
      color: var(--accent-2);
      background: rgba(126,217,202,0.08);
      border: 1px solid rgba(126,217,202,0.16);
    }

    .mini-pill {
      color: var(--muted);
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.08);
    }

    h1,h2,h3,p { margin: 0; }

    h1 {
      margin-top: 18px;
      max-width: 9ch;
      font-family: Manrope, Inter, sans-serif;
      font-size: clamp(3rem, 8vw, 6rem);
      line-height: 0.92;
      letter-spacing: -0.07em;
    }

    .hero-copy {
      max-width: 62ch;
      margin-top: 22px;
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.75;
    }

    .hero-actions,
    .hero-pills,
    .cta-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .hero-actions { margin-top: 28px; }
    .hero-pills { margin-top: 22px; }

    .section {
      padding: 22px 0;
    }

    .section-head {
      margin-bottom: 16px;
    }

    .label {
      color: var(--faint);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      font-size: 0.72rem;
    }

    .section-head h2 {
      margin-top: 10px;
      font-family: Manrope, Inter, sans-serif;
      font-size: clamp(1.9rem, 4vw, 3rem);
      line-height: 0.98;
      letter-spacing: -0.05em;
    }

    .section-head p {
      margin-top: 12px;
      max-width: 54ch;
      color: var(--muted);
      line-height: 1.72;
    }

    .grid-3,
    .grid-2 {
      display: grid;
      gap: 18px;
    }

    .grid-3 { grid-template-columns: repeat(3, 1fr); }
    .grid-2 { grid-template-columns: repeat(2, 1fr); }

    .panel {
      padding: 24px;
    }

    .panel h3 {
      margin-top: 8px;
      margin-bottom: 10px;
      font-size: 1.12rem;
      letter-spacing: -0.03em;
    }

    .panel p {
      color: var(--muted);
      line-height: 1.72;
    }

    .list {
      list-style: none;
      padding: 0;
      margin: 16px 0 0;
      display: grid;
      gap: 10px;
      color: var(--muted);
    }

    .list li::before {
      content: "—";
      color: var(--accent);
      margin-right: 10px;
    }

    .cta {
      padding: 24px 0 80px;
    }

    .cta-shell {
      padding: 30px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .cta-copy h2 {
      font-family: Manrope, Inter, sans-serif;
      font-size: clamp(2rem, 4vw, 3.2rem);
      line-height: 0.95;
      letter-spacing: -0.05em;
      max-width: 10ch;
    }

    .cta-copy p {
      margin-top: 14px;
      max-width: 50ch;
      color: var(--muted);
      line-height: 1.72;
    }

    .footer {
      padding: 0 0 34px;
    }

    .footer-inner {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      padding-top: 18px;
      border-top: 1px solid rgba(255,255,255,0.08);
      color: var(--faint);
      font-size: 0.9rem;
    }

    @media (max-width: 960px) {
      .grid-3,
      .grid-2,
      .cta-shell {
        grid-template-columns: 1fr;
        display: grid;
      }

      .nav .nav-link { display: none; }
    }

    @media (max-width: 640px) {
      .wrap { width: min(calc(100% - 20px), var(--max)); }
      .header-inner { padding: 14px 0; }
      .hero { padding-top: 40px; }
      .hero-shell,
      .panel,
      .cta-shell { padding: 20px; }
      h1 { max-width: 100%; }
      .hero-actions,
      .hero-pills,
      .cta-actions { flex-direction: column; }
      .btn { width: 100%; }
      .footer-inner { flex-direction: column; }
      .brand-name { display: none; }
    }
  </style>
</head>

      </a>

  </header>

        <h1>Less manual work. More leverage.</h1>
