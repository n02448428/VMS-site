<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VisionaryMinds Solutions</title>
  <meta name="description" content="VisionaryMinds Solutions builds clean AI automations, agents, and workflows for businesses that want faster execution and less operational drag." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0d0f12;
      --panel: rgba(255,255,255,0.04);
      --border: rgba(255,255,255,0.10);
      --border-strong: rgba(255,255,255,0.16);
      --text: #f3f4f6;
      --muted: #a1a7b3;
      --faint: #737b88;
      --accent: #7dd3c7;
      --accent-strong: #b5fff4;
      --shadow: 0 20px 60px rgba(0,0,0,0.35);
      --radius: 24px;
      --max: 1120px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: Inter, system-ui, sans-serif;
      background:
        radial-gradient(circle at top left, rgba(125, 211, 199, 0.08), transparent 30%),
        linear-gradient(180deg, #0d0f12 0%, #101318 100%);
      color: var(--text);
      min-height: 100vh;
    }

    a { color: inherit; text-decoration: none; }
    .wrap { width: min(calc(100% - 32px), var(--max)); margin: 0 auto; }

    .site-header {
      position: sticky;
      top: 0;
      z-index: 10;
      backdrop-filter: blur(16px);
      background: rgba(13, 15, 18, 0.72);
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }

    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 18px 0;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      font-weight: 700;
      letter-spacing: -0.03em;
    }

    .brand-mark {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      border: 1px solid var(--border-strong);
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, rgba(125, 211, 199, 0.14), rgba(255,255,255,0.02));
    }

    .brand-mark svg { width: 18px; height: 18px; }

    .nav { display: flex; align-items: center; gap: 18px; }
    .nav a { color: var(--muted); font-size: 0.95rem; }
    .nav a:hover { color: var(--text); }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 0 18px;
      border-radius: 999px;
      border: 1px solid var(--border);
      font-weight: 600;
      transition: 180ms ease;
    }

    .btn-primary {
      background: var(--text);
      color: #0d0f12;
      border-color: transparent;
      box-shadow: 0 10px 30px rgba(255,255,255,0.10);
    }

    .btn-primary:hover { transform: translateY(-1px); background: #ffffff; }

    .hero {
      padding: 80px 0 26px;
    }

    .hero-shell,
    .panel,
    .booking-shell {
      background: linear-gradient(180deg, rgba(255,255,255,0.045), rgba(255,255,255,0.025));
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .hero-shell {
      padding: 38px;
    }

    .eyebrow,
    .pill {
      display: inline-flex;
      align-items: center;
      padding: 8px 12px;
      border-radius: 999px;
      font-size: 0.82rem;
      letter-spacing: 0.02em;
      color: var(--accent-strong);
      background: rgba(125, 211, 199, 0.08);
      border: 1px solid rgba(125, 211, 199, 0.14);
    }

    h1,h2,h3,p { margin: 0; }

    h1 {
      margin-top: 18px;
      font-family: Manrope, Inter, sans-serif;
      font-size: clamp(3rem, 8vw, 6rem);
      line-height: 0.92;
      letter-spacing: -0.07em;
      max-width: 9ch;
    }

    .hero-copy {
      max-width: 66ch;
      margin-top: 22px;
      color: var(--muted);
      font-size: 1.06rem;
      line-height: 1.75;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      margin-top: 28px;
    }

    .hero-notes {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 22px;
    }

    .hero-notes .pill {
      color: var(--muted);
      background: rgba(255,255,255,0.03);
      border-color: rgba(255,255,255,0.08);
    }

    .section { padding: 22px 0; }

    .grid-3,
    .grid-2 {
      display: grid;
      gap: 18px;
    }

    .grid-3 { grid-template-columns: repeat(3, 1fr); }
    .grid-2 { grid-template-columns: repeat(2, 1fr); }

    .panel { padding: 24px; }

    .label {
      color: var(--faint);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      font-size: 0.72rem;
    }

    .panel h3 {
      margin-top: 8px;
      margin-bottom: 10px;
      font-size: 1.14rem;
      letter-spacing: -0.03em;
    }

    .panel p {
      color: var(--muted);
      line-height: 1.72;
    }

    .section-head {
      margin-bottom: 16px;
    }

    .section-head h2 {
      margin-top: 10px;
      font-family: Manrope, Inter, sans-serif;
      font-size: clamp(1.9rem, 4vw, 3rem);
      letter-spacing: -0.05em;
      line-height: 0.98;
    }

    .section-head p {
      margin-top: 12px;
      max-width: 54ch;
      color: var(--muted);
      line-height: 1.72;
    }

    .list {
      list-style: none;
      padding: 0;
      margin: 16px 0 0;
      display: grid;
      gap: 10px;
      color: var(--muted);
    }

    .list li::before {
      content: "—";
      color: var(--accent);
      margin-right: 10px;
    }

    .booking {
      padding: 24px 0 80px;
    }

    .booking-shell {
      display: grid;
      grid-template-columns: 0.8fr 1.2fr;
      overflow: hidden;
    }

    .booking-copy,
    .booking-box { padding: 28px; }

    .booking-copy {
      border-right: 1px solid var(--border);
      background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(125,211,199,0.04));
    }

    .booking-copy h2 {
      margin-top: 12px;
      font-family: Manrope, Inter, sans-serif;
      font-size: clamp(2rem, 4vw, 3.2rem);
      line-height: 0.95;
      letter-spacing: -0.05em;
      max-width: 8ch;
    }

    .booking-copy p {
      margin-top: 16px;
      color: var(--muted);
      line-height: 1.72;
    }

    .booking-points {
      display: grid;
      gap: 10px;
      margin-top: 20px;
    }

    .booking-points .pill {
      width: fit-content;
      color: var(--muted);
      background: rgba(255,255,255,0.03);
      border-color: rgba(255,255,255,0.08);
    }

    .booking-box iframe {
      width: 100%;
      min-height: 720px;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 18px;
      background: rgba(255,255,255,0.02);
    }

    .booking-fallback {
      margin-top: 14px;
      color: var(--muted);
      font-size: 0.94rem;
      line-height: 1.6;
    }

    .footer {
      padding: 0 0 34px;
    }

    .footer-inner {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      padding-top: 18px;
      border-top: 1px solid rgba(255,255,255,0.08);
      color: var(--faint);
      font-size: 0.9rem;
    }

    @media (max-width: 960px) {
      .grid-3,
      .grid-2,
      .booking-shell {
        grid-template-columns: 1fr;
      }

      .booking-copy { border-right: 0; border-bottom: 1px solid var(--border); }
      .nav a:not(.btn) { display: none; }
    }

    @media (max-width: 640px) {
      .wrap { width: min(calc(100% - 20px), var(--max)); }
      .header-inner { padding: 14px 0; }
      .hero { padding-top: 38px; }
      .hero-shell,
      .panel,
      .booking-copy,
      .booking-box { padding: 20px; }
      h1 { max-width: 100%; }
      .hero-actions { flex-direction: column; }
      .btn { width: 100%; }
      .footer-inner { flex-direction: column; }
      .booking-box iframe { min-height: 660px; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
